[project]
name = "bash-agent"
version = "0.1.0"
description = "Language-agnostic environment setup agent"
requires-python = ">=3.10"

dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.0.5",
    "aiodocker>=0.21.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0.0",
    "jsonlines>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
setup-agent = "bash_agent.main:main"
